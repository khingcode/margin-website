<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Margin — review</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<header class="top"><a class="logo" href="./"><i></i>Margin</a><span class="hand">click the work to leave a note</span></header>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
const root = $('#root');
const token = new URLSearchParams(location.search).get('p');
let proj, comments = [], pending = null;

function fail(t) { root.replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'card' }, h('h2', {}, t)))); }

async function init() {
  if (!configured) return root.replaceChildren(h('div', { class: 'wrap' }, setupNotice()));
  if (!token || !/^[0-9a-f-]{36}$/i.test(token)) return fail("This review link doesn't look right.");
  const { data, error } = await sb.rpc('get_project_by_token', { t: token });
  if (error || !data) return fail("We couldn't find that review. Ask for a fresh link.");
  proj = data;
  document.title = `${proj.name} — Margin review`;
  const fileUrl = sb.storage.from('files').getPublicUrl(proj.file_path).data.publicUrl;

  const stage = h('div', { class: 'stage' });
  const side = h('aside', { class: 'side', 'aria-live': 'polite' });
  root.replaceChildren(h('div', { class: 'review' }, stage, side));
  buildSide(side);
  await buildPages(stage, fileUrl);
  await refresh();
  setInterval(refresh, 8000);
}

async function buildPages(stage, url) {
  const mk = n => { const p = h('div', { class: 'page', 'data-page': n, tabindex: 0, 'aria-label': `Page ${n}. Click to drop a note.` });
    p.addEventListener('click', e => { if (!e.target.closest('.pin')) place(p, e); });
    p.addEventListener('keydown', e => { if (e.key === 'Enter') { const r = p.getBoundingClientRect(); place(p, { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }); } });
    stage.append(p); return p; };
  if (proj.file_type === 'image') {
    mk(1).prepend(h('img', { src: url, alt: proj.name, draggable: 'false', onload: renderPins }));
  } else {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    try {
      const pdf = await pdfjsLib.getDocument(url).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const pg = await pdf.getPage(i), vp = pg.getViewport({ scale: 1.6 });
        const c = h('canvas', { width: vp.width, height: vp.height });
        mk(i).prepend(c);
        await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
    } catch { stage.append(h('p', { class: 'msg err' }, "Couldn't load this PDF.")); }
  }
}

function place(pageEl, e) {
  if (proj.status === 'approved') return;
  const r = pageEl.getBoundingClientRect();
  const x = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
  const y = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
  pending = { page: +pageEl.dataset.page, x, y };
  renderPins(); showComposer();
}

function renderPins() {
  document.querySelectorAll('.pin').forEach(p => p.remove());
  const add = (c, n, cls) => { const pg = document.querySelector(`.page[data-page="${c.page}"]`); if (!pg) return;
    const p = h('div', { class: 'pin ' + cls, style: `left:${c.x}%;top:${c.y}%`, 'data-id': c.id || '' }, h('b', {}, n)); pg.append(p); };
  comments.forEach((c, i) => add(c, i + 1, c.resolved ? 'resolved' : ''));
  if (pending) add(pending, comments.length + 1, 'pending');
}

let comp, nameIn, bodyIn, listEl, roundEl, statusEl, msgEl;
function buildSide(side) {
  roundEl = h('div', { class: 'row', style: 'justify-content:space-between' });
  statusEl = h('div');
  msgEl = h('p', { class: 'msg', role: 'status' });
  nameIn = h('input', { type: 'text', maxlength: 60, placeholder: 'Your name', 'aria-label': 'Your name' });
  try { nameIn.value = localStorage.getItem('margin_name') || ''; } catch {}
  bodyIn = h('textarea', { maxlength: 1000, placeholder: 'What should change here?', 'aria-label': 'Your note' });
  comp = h('div', { class: 'comp', hidden: true },
    h('strong', {}, 'New note'), h('div', { style: 'height:8px' }), nameIn, bodyIn,
    h('div', { class: 'row', style: 'margin-top:8px' },
      h('button', { class: 'btn sm primary', onclick: submit }, 'Pin it'),
      h('button', { class: 'btn sm', onclick: () => { pending = null; comp.hidden = true; renderPins(); } }, 'Cancel')), msgEl);
  listEl = h('div', { style: 'display:grid;gap:10px' });
  side.append(h('h1', {}, proj.name), roundEl, statusEl, comp, h('h3', { style: 'font-size:1.1rem' }, 'Notes'), listEl, approveBox());
}
function showComposer() { comp.hidden = false; setMsg(msgEl, ''); bodyIn.focus({ preventScroll: true }); }

async function submit(ev) {
  const name = nameIn.value.trim(), body = bodyIn.value.trim();
  if (!pending) return;
  if (!name || !body) return setMsg(msgEl, 'Add your name and a note.', true);
  ev.target.disabled = true;
  const { error } = await sb.rpc('add_comment_by_token', { t: token, p_page: pending.page, p_x: pending.x, p_y: pending.y, p_author: name, p_body: body });
  ev.target.disabled = false;
  if (error) return setMsg(msgEl, "Couldn't save that note. Please try again.", true);
  try { localStorage.setItem('margin_name', name); } catch {}
  pending = null; bodyIn.value = ''; comp.hidden = true; await refresh();
}

function approveBox() {
  const box = h('div', { id: 'approve', class: 'comp' });
  const who = h('input', { type: 'text', maxlength: 60, placeholder: 'Type your name to approve' });
  const m = h('p', { class: 'msg', role: 'status' });
  box.append(h('strong', {}, 'All done?'), h('p', { class: 'muted' }, 'Approving tells the designer this version is signed off.'), h('div', { style: 'height:8px' }), who,
    h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'btn sm sage', onclick: async () => {
      if (!who.value.trim()) return setMsg(m, 'Add your name first.', true);
      const { error } = await sb.rpc('approve_by_token', { t: token, p_name: who.value });
      if (error) return setMsg(m, "Couldn't approve. Try again.", true);
      const { data } = await sb.rpc('get_project_by_token', { t: token }); proj = data; renderSide();
    } }, 'Approve this version')), m);
  return box;
}

function renderSide() {
  roundEl.replaceChildren(h('span', { class: 'chip' }, `Round ${proj.rounds_used} of ${proj.rounds_total}`));
  if (proj.is_owner) roundEl.append(h('button', { class: 'btn sm', onclick: async () => {
    await sb.from('projects').update({ rounds_used: proj.rounds_used + 1, status: 'open', approved_by: null, approved_at: null }).eq('share_token', token);
    const { data } = await sb.rpc('get_project_by_token', { t: token }); proj = data; renderSide(); } }, 'Next round'));
  statusEl.replaceChildren(proj.status === 'approved'
    ? h('div', { class: 'banner' }, `Approved by ${proj.approved_by} · ${new Date(proj.approved_at).toLocaleString()}`) : '');
  $('#approve').hidden = proj.status === 'approved' || proj.is_owner;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('locked', proj.status === 'approved'));
  listEl.replaceChildren(...(comments.length ? comments.map((c, i) => {
    const n = i + 1;
    const el = h('div', { class: 'cm' + (c.resolved ? ' resolved' : ''), onmouseenter: () => hl(c.id, 1), onmouseleave: () => hl(c.id, 0) },
      h('small', {}, h('span', {}, n), c.author, ' · ', new Date(c.created_at).toLocaleDateString()), h('p', {}, c.body));
    if (proj.is_owner) el.append(h('button', { class: 'btn sm', style: 'margin-top:8px', onclick: async () => {
      await sb.from('comments').update({ resolved: !c.resolved }).eq('id', c.id); refresh(); } }, c.resolved ? 'Reopen' : 'Mark resolved'));
    return el; }) : [h('p', { class: 'muted' }, 'No notes yet. Click anywhere on the work to add one.')]));
}
function hl(id, on) { document.querySelectorAll(`.pin[data-id="${id}"]`).forEach(p => p.classList.toggle('hl', !!on)); }

async function refresh() {
  const { data } = await sb.rpc('list_comments_by_token', { t: token });
  if (data) comments = data;
  renderPins(); renderSide();
}
init();
</script></body></html>
